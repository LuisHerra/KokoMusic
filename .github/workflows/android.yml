name: Build Android APK (Chaquopy Embebido)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para publicar la APK en la release "android-latest"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # La APK sirve su propia copia de la web desde el servidor embebido
      # (android/app/src/main/python/static). Se recompila en cada build para
      # que la app lleve siempre la última versión del frontend.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for the APK (base "/")
        working-directory: frontend
        env:
          VITE_BUILD_MODE: local
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TICKETMASTER_KEY: ${{ secrets.VITE_TICKETMASTER_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Embed frontend into the APK
        run: |
          rm -rf android/app/src/main/python/static
          cp -r frontend/dist android/app/src/main/python/static
          ls android/app/src/main/python/static

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Chaquopy exige que el Python de compilación sea la misma versión que
      # el del APK (android/app/build.gradle.kts → chaquopy.version = "3.11")
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # La versión del wrapper del proyecto (gradle-wrapper.properties); el
      # Gradle "latest" del runner no es compatible con AGP 8.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KokoMusic-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # La web enlaza a releases/download/android-latest/KokoMusic.apk
      # (frontend/src/lib/androidApp.ts): se recrea la release en cada push a
      # master para que ese enlace siempre sirva la última APK.
      - name: Publish APK to "android-latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KokoMusic.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest KokoMusic.apk             --target "$GITHUB_SHA"             --title "KokoMusic para Android (última versión)"             --notes "APK generada automáticamente desde ${GITHUB_SHA::7}. Descárgala e instálala en tu Android (permite instalar apps de origen desconocido)."
