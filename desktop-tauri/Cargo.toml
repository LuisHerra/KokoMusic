[package]
name = "kokomusic"
version = "1.0.0"
description = "KokoMusic para Windows (WebView2, bajo consumo)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# Mismas versiones que usa tauri: acceso directo a WebView2 (permisos y memoria).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Binario pequeño: menos disco y menos memoria al cargarlo.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
